# title of casting.
castingTitle:
  普通配置:
    普通1: "你村默认配置"
    普通2: "总体来说保留共有的变种配置。(除13配置外，默认加猫)12b狂人改末裔、13A式配置（3狼无猫）、14-15 D猫配置 15改听狂 16为4狼+背德配置。18为18A猫追加背德。19人追加晴天娃娃，20起为多占；"
    普通3: "15人及以下去掉共有的变种配置。12听狂面包配置、13低语共有配置。14-15共有更换猫又+村人。16A听狂、17A听狂+异端、18A猫听狂。19人追加背德者和圣痕者，21起为多占后略.."
  特殊职业配置:
    恋人: "恋人会出现的配置。（求爱者配置为无欠，由于无法单独设置欠，12求爱时请手动调，否则会变成无欠11恋）"
    超职业: "SP占卜师、SP猎人、SP人狼和SP妖狐会出现的配置。此外背德者替换为背信者。17人为听狂+背信。"
    女王村: "存在女王观战者的村子。默认设定无替身君没有人会死。（即人数-1才是对应配置，如GM+玩家为14人，对应的配置为13人配置）"
    女王村（有欠）: "存在女王观战者的村子。默认设定有替身君。大村游荡+黑骑士双猎。"
    魔女反逆者: "魔女反逆者默认配置"
    黑骑士: "黑骑士和游荡猎人会出现的配置。"
    无谋占卜师: "无谋占卜师会出现的配置。基本在14人以上。"
  固定人数配置:
    9D: "9人 - 9D / 村人: 4 占卜师: 1 人狼: 1 妖狐: 1 背德者: 2"
    10人无欠九尾狐: "10人 - 10人无欠九尾狐 / 村人: 3 占卜师: 1 灵能者: 1 SP猎人: 1 人狼: 1 硬汉人狼: 1 狂人: 1 九尾狐: 1"
    11猪男: "11人 - 11猪男 / 村人: 4 占卜师: 1 灵能者: 1 猎人: 1 人狼: 2 狂人: 1 猪男: 1"
    12全面战争: "12人 - 12全面战争 / 占卜师: 2 灵能者: 2 猎人: 1 人狼: 2 狂人: 1 狂信者: 1 妖狐：2 背德者：1"
  桃栗配置:
    蝙蝠: "蝙蝠会出现的配置。"
    贵族奴隶: "贵族与奴隶会出现的配置。"
    魔术师: "魔术师会出现的配置。"
    间谍: "间谍会出现的配置。"
    人狼幻术师: "人狼幻术师会出现的配置。"
    商人: "商人会出现的配置。"
  主题配置:
    独裁者村: "御兔设计的配置，独裁者与狂人活跃的村子。无欠。"
    变化村: "有很多能够变换职业的人。"
    黑村: "黑啊，真他妈黑啊。村人几乎看不到生存希望的村子。"
  其他:
    疯狂的世界: "狂人很多。"
    六方混战: "多个阵营的大乱战。"
    spaceWerewolf: '在宇宙中展开的人狼。职业名和设定与普通人狼不同。'
  特殊规则:
    自由配置: "可以自由的选择角色。"
    黑暗火锅: "各角色人数将随机分配。"
    手调黑暗火锅: "一部分角色由房主分配，其他角色随机分配。"
    量子人狼: "全员的的真实职业以概率表示。只有村人・人狼・占卜师。"
    Endless黑暗火锅: "可以中途参加・死亡后有可能转生的黑暗火锅。"
    easyYaminabe: "能够轻松参与的黑暗火锅。大体上是在普通村的基础上，随机1-2个职业用特殊职业进行替换。"

